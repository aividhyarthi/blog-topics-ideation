name: CI

# Build-checks every pull request and every push to the default branch so a
# broken build can't be merged or deployed.
on:
  pull_request:
  push:
    branches: [claude/friendly-wright-zjHg8]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
