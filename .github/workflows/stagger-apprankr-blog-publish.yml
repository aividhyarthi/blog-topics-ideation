# Drains the AppRankr blog's staggered-publish queue. See
# publish-queue/README.md on claude/app-ranking-tracker-sbjs7j-queue for the
# full explanation. This workflow only reads that queue branch and pushes
# already-committed commits to claude/app-ranking-tracker-sbjs7j (the live
# AppRankr blog branch) once their scheduled time has passed. It does not
# touch any other branch.
#
# Checks every 2 hours. Each run pushes every queued post that's come due since the last check (see
# scripts/drain-stagger-queue.mjs), so a 2-hourly check loses nothing - a post just goes live within 2
# hours of its scheduled time instead of within 20 minutes. Comfortable for the current 3-5 posts/day pace.
name: Drain AppRankr blog publish queue

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apprankr-blog-publish-queue

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/app-ranking-tracker-sbjs7j-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drain due posts to the live branch
        run: node scripts/drain-stagger-queue.mjs
      - name: Commit updated queue state
        if: always()
        run: |
          git config user.name "apprankr-publish-bot"
          git config user.email "apprankr-publish-bot@users.noreply.github.com"
          git add publish-queue/pending.txt
          if ! git diff --cached --quiet; then
            git commit -m "Drain AppRankr blog publish queue"
            git push origin HEAD:claude/app-ranking-tracker-sbjs7j-queue
          else
            echo "No queue-state change to commit."
          fi
