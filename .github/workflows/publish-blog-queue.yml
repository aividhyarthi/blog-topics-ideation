name: Drain scheduled blog queue

# Pushes every post in blog-queue/pending/ to the live site, each already
# carrying its own future publishDate — the site itself decides when each
# one actually becomes visible (see listPublishedPosts() in blogPosts.ts).
# This job's only responsibility is "make sure it exists before its date",
# so running a few times a day is plenty; it does not need to fire at the
# exact minute a post should go live.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-blog-queue

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeo-checker
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Drain queue
        id: drain
        env:
          BLOG_SITE_URL: ${{ secrets.BLOG_SITE_URL }}
          BLOG_PUBLISH_TOKEN: ${{ secrets.BLOG_PUBLISH_TOKEN }}
        run: node scripts/publish-queue.mjs
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add blog-queue/
          git diff --cached --quiet || git commit -m "Drain blog queue"
          git diff --cached --quiet || git push origin HEAD:aeo-checker
